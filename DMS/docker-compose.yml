services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    ports:
      - "5432:5432"
    volumes:
      # Ab Postgres 18 muss das Volume auf /var/lib/postgresql gemountet werden
      # (nicht mehr auf /var/lib/postgresql/data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 5s
      retries: 10

  dms-api:
    build:
      context: .                  # Ordner mit DMS.sln und src/
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=paperless;Username=paperless;Password=paperless"

volumes:
  pgdata:
