x-file-storage: &file-storage
  FileStorage__Endpoint: http://minio:9000
  FileStorage__AccessKey: ${MINIO_ROOT_USER}
  FileStorage__SecretKey: ${MINIO_ROOT_PASSWORD}

services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      # Ab Postgres 18 muss das Volume auf /var/lib/postgresql gemountet werden
      # (nicht mehr auf /var/lib/postgresql/data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build: ./minio
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in DMS/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in DMS/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9090:9090"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  dms-api:
    build:
      context: .                  # Ordner mit DMS.sln und src/
      dockerfile: dockerfile
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *file-storage
      ConnectionStrings__Postgres: "Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Authentication__MetadataAddress: "http://keycloak:8080/realms/dms/.well-known/openid-configuration"
    volumes:
      - dms_data:/app/App_Data

  ocr-worker:
    build:
      context: .
      dockerfile: src/DMS.OcrWorker/Dockerfile
    container_name: dms-ocr-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *file-storage
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__UserName: ${RABBITMQ_USER:-dms}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-dms}
      RabbitMQ__QueueName: ocr.documents
    restart: unless-stopped

  dms-frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "80:80"
    depends_on:
      - dms-api

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME: "http://localhost:8082"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  elasticsearch-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    profiles: ["setup"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      Elasticsearch__Url: "${ELASTICSEARCH_URL:-http://elasticsearch:9200}"
      Elasticsearch__IndexName: "${ELASTICSEARCH_INDEX_NAME:-dms-documents}"
    volumes:
      - ./elasticsearch/documents-index.json:/opt/dms/documents-index.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        index_url="$${Elasticsearch__Url%/}/$${Elasticsearch__IndexName}"
        status=$$(curl -sS --max-time 10 --head --output /dev/null \
          --write-out '%{http_code}' "$$index_url")

        case "$$status" in
          200) echo "Index already exists: $$index_url" ;;
          404)
            curl -fsS --max-time 30 --request PUT \
              --header 'Content-Type: application/json' \
              --data-binary @/opt/dms/documents-index.json "$$index_url"
            ;;
          *) echo "Index check failed with HTTP $$status: $$index_url" >&2; exit 1 ;;
        esac

volumes:
  rabbitmq_data:
  pgdata:
  dms_data:
  minio_data:
  keycloak_data:
  elasticsearch_data:
