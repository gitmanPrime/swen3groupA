<h2>Documents</h2>
@if (loading()) {
  <p>Loading documents...</p>
} @else if (error()) {
  <p role="alert">{{ error() }}</p>
} @else {
  <ul>
    @for (document of documents(); track document.id) {
      <li><a [routerLink]="['/documents', document.id]">{{ document.fileName }}</a></li>
    } @empty {
      <li>No documents yet.</li>
    }
  </ul>
}
