<section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <h3 class="text-base font-bold text-slate-900 mb-4">
    Tags
  </h3>

  <div class="flex flex-wrap gap-2 mb-4">
    @for (tag of assignedTags(); track tag.id) {
      <span
        class="inline-flex items-center gap-2 rounded-full bg-blue-50
               px-3 py-1 text-sm text-blue-700"
      >
        {{ tag.name }}

        <button
          type="button"
          (click)="removeTag(tag)"
          class="font-bold hover:text-red-600"
          [attr.aria-label]="'Remove tag ' + tag.name"
        >
          &times;
        </button>
      </span>
    }

    @if (assignedTags().length === 0) {
      <p class="text-sm text-slate-500">
        No tags have been assigned to this document yet.
      </p>
    }
  </div>

  <!-- Assign one of the existing tags to this document -->
  <form (ngSubmit)="assignTag()" class="flex flex-wrap gap-2">
    <select
      name="selectedTagId"
      [ngModel]="selectedTagId()"
      (ngModelChange)="selectedTagId.set($event)"
      class="min-w-0 flex-1 rounded-lg border border-slate-300 px-3 py-2"
    >
      <option value="">Select a tag…</option>

      @for (tag of tags(); track tag.id) {
        <option
          [value]="tag.id"
          [disabled]="assignedTags().some(t => t.id === tag.id)"
        >
          {{ tag.name }}
        </option>
      }
    </select>

    <button
      type="submit"
      [disabled]="!selectedTagId()"
      class="rounded-lg bg-blue-600 px-4 py-2 text-sm
             font-semibold text-white disabled:opacity-50"
    >
      Add tag
    </button>
  </form>

  <!-- Create a brand-new tag and leave it unassigned until picked above -->
  <form
    (ngSubmit)="createTag()"
    class="mt-4 flex flex-wrap gap-2 border-t border-slate-100 pt-4"
  >
    <input
      type="text"
      name="tagName"
      [ngModel]="newTagName()"
      (ngModelChange)="newTagName.set($event)"
      placeholder="Create a new tag…"
      class="min-w-0 flex-1 rounded-lg border border-slate-300 px-3 py-2"
    />

    <button
      type="submit"
      [disabled]="!newTagName().trim()"
      class="rounded-lg border border-slate-300 px-4 py-2
             text-sm font-medium disabled:opacity-50"
    >
      Create
    </button>
  </form>

  @if (successMessage()) {
    <p role="status" class="mt-3 text-sm text-green-700">
      {{ successMessage() }}
    </p>
  }

  @if (errorMessage()) {
    <p role="alert" class="mt-3 text-sm text-red-600">
      {{ errorMessage() }}
    </p>
  }
</section>
